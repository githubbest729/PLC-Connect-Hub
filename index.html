<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PLC-Connect Hub</title><meta name="theme-color" content="#0c1117">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.ico.svg"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png.svg">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head>
<body class="bg-slate-950 text-slate-200">
<header class="flex items-center justify-between px-4 py-3 border-b border-slate-700">
<h1 class="text-xl font-bold">PLC-Connect <span class="text-amber-400">Hub</span></h1><span id="net" class="text-xs"></span></header>
<nav id="tabs" class="flex overflow-x-auto border-b border-slate-700">
<button data-t="map">Tag mapper</button><button data-t="proto">Protocols</button><button data-t="vault">Snippets</button><button data-t="proj">Projects</button></nav>
<main class="max-w-4xl mx-auto p-4">

<section id="map" hidden>
<div class="grid sm:grid-cols-2 gap-3">
<label>PLC brand<select id="brand"><option value="s7">Siemens S7 (TIA Portal)</option><option value="ab">Allen-Bradley</option></select></label>
<label>PLC address or tag<input id="addr" placeholder="DB1.DBD4 / M10.0 / Motor1.Speed / N7:0" autocapitalize="off"></label>
<label>Type override (DBD/MD or symbolic)<select id="ovr"><option value="">Auto</option><option>REAL</option><option>DINT</option><option>INT</option></select></label>
<label>Raw min / max<span class="two"><input id="rmin" type="number" value="0"><input id="rmax" type="number" value="27648"></span></label>
<label>Engineering min / max<span class="two"><input id="emin" type="number" value="0"><input id="emax" type="number" value="100"></span></label>
<div class="flex items-end"><button class="pri" id="go">Generate Wonderware syntax</button></div></div>
<div id="mapOut" class="mt-4"></div>
<p class="hint">DAS item syntax differs between DASSIDirect, DASABCIP and DASABTCP versions. Check the output against your installed DAS before bulk import.</p>
</section>

<section id="proto" hidden>
<h2>Modbus register calculator</h2>
<div class="grid sm:grid-cols-3 gap-3">
<label>Register (40001, 30010, 400001...)<input id="reg" placeholder="40001"></label>
<label>If no prefix<select id="fc"><option value="3">Holding (FC03)</option><option value="4">Input reg (FC04)</option><option value="1">Coil (FC01)</option><option value="2">Discrete in (FC02)</option></select></label>
<label>Numbering<select id="zb"><option value="0">1-based (as in docs)</option><option value="1">0-based (already offset)</option></select></label></div>
<div id="mbOut" class="mt-3"></div>
<h2 class="mt-6">Connection quick-copy</h2>
<div class="grid sm:grid-cols-3 gap-3"><label>IP address<input id="ip" value="192.168.1.10"></label>
<label>Protocol<select id="pp"><option value="502">Modbus TCP 502</option><option value="4840">OPC UA 4840</option><option value="102">S7 / ISO-on-TCP 102</option><option value="44818">EtherNet/IP 44818</option></select></label>
<label>Port<input id="port" value="502"></label></div>
<div id="ipOut" class="mt-3"></div>
</section>

<section id="vault" hidden>
<div class="grid gap-3">
<div class="grid sm:grid-cols-3 gap-3"><label>Title<input id="vt"></label><label>Type<select id="vy"><option>SQL</option><option>QuickScript</option></select></label><label>Search<input id="vs" placeholder="Filter"></label></div>
<label>Code<textarea id="vc" rows="6" spellcheck="false">
